name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-x86:
    name: Windows x86 DLL
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure MSVC x86 tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Test session analyzer fixtures
        shell: powershell
        run: .\Test-AnalyzeOmsiCrashSession.ps1

      - name: Test guarded patch transport
        shell: powershell
        run: .\Test-PatchOmsiRuntime.ps1

      - name: Test probe handler core
        shell: cmd
        run: Test-OmsiCrashProbeCore.bat

      - name: Test native patch core
        shell: cmd
        run: Test-PatchCore.bat

      - name: Configure CMake
        run: cmake -S . -B build-x86 -A Win32

      - name: Build Release DLL
        run: cmake --build build-x86 --config Release

      - name: Smoke-test native inspection CLI
        shell: powershell
        run: |
          $result = .\build-x86\Release\OmsiPatchTool.exe inspect .\build-x86\Release\OmsiPatchTool.exe | ConvertFrom-Json
          if (-not $result.ok -or $result.machine -ne '0x014C' -or $result.sha256.Length -ne 64) {
            throw 'Native inspection CLI returned an invalid identity'
          }

      - name: Verify native GUI resources
        shell: powershell
        run: |
          $version = (Get-Item .\build-x86\Release\OmsiCrashProbe.exe).VersionInfo
          if ($version.ProductName -ne 'OMSI Crash Probe' -or $version.FileVersion -ne '0.1.0.0' -or $version.CompanyName -ne 'Juanjo Rubio') {
            throw 'Native GUI version resources are missing or incorrect'
          }

      - name: Package OMSI plugin files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath build-x86/Release/OmsiCrashProbe.dll -Destination dist/OmsiCrashProbe.dll
          Copy-Item -LiteralPath OmsiCrashProbe.opl -Destination dist/OmsiCrashProbe.opl
          Copy-Item -LiteralPath build-x86/Release/OmsiCrashProbe.exe -Destination dist/OmsiCrashProbe.exe
          Copy-Item -LiteralPath build-x86/Release/OmsiPatchTool.exe -Destination dist/OmsiPatchTool.exe
          Copy-Item -LiteralPath patch-manifest.json -Destination dist/patch-manifest.json
          Copy-Item -LiteralPath LICENSE -Destination dist/LICENSE
          Copy-Item -LiteralPath THIRD_PARTY_NOTICES.md -Destination dist/THIRD_PARTY_NOTICES.md
          Copy-Item -LiteralPath third_party/nlohmann/LICENSE.MIT -Destination dist/nlohmann-json-LICENSE.MIT
          Compress-Archive -Path dist/* -DestinationPath OmsiCrashProbe-win32.zip -Force

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmsiCrashProbe-win32
          path: OmsiCrashProbe-win32.zip
